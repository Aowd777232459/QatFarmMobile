name: Recover 2.2.1 source
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install ILSpy command line
        run: dotnet tool install --global ilspycmd
      - name: Recover project
        run: |
          mkdir -p recovered
          ilspycmd -p -o recovered recovery/QatFarm.Mobile.dll
      - uses: actions/upload-artifact@v4
        with:
          name: QatFarm-Mobile-2.2.1-Recovered
          path: recovered
          retention-days: 3
