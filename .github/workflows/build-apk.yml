name: Build QatFarm Android + Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract mobile source
        shell: pwsh
        run: |
          if (-not (Test-Path "QatFarmMobile_Source.zip")) {
            throw "QatFarmMobile_Source.zip was not found in the repository root."
          }
          Expand-Archive -Path "QatFarmMobile_Source.zip" -DestinationPath "source" -Force

      - name: Locate project and signing key
        id: locate
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path "source" -Recurse -Filter "QatFarm.Mobile.csproj" | Select-Object -First 1
          if (-not $project) { throw "QatFarm.Mobile.csproj was not found." }

          $keystore = Get-ChildItem -Path "source" -Recurse -Filter "QatFarmMobile.keystore" | Select-Object -First 1
          if (-not $keystore) { throw "QatFarmMobile.keystore was not found." }

          "project=$($project.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "projectDir=$($project.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "keystore=$($keystore.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install .NET MAUI Android workload
        shell: pwsh
        run: |
          dotnet workload install maui-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Android API 36 SDK
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkmanager)) {
            $candidate = Get-ChildItem -Path (Join-Path $env:ANDROID_HOME "cmdline-tools") -Recurse -Filter "sdkmanager.bat" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $sdkmanager = $candidate.FullName }
          }
          if (-not (Test-Path $sdkmanager)) { throw "Android sdkmanager.bat was not found." }
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore project
        shell: pwsh
        run: |
          dotnet workload restore "${{ steps.locate.outputs.project }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore "${{ steps.locate.outputs.project }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build signed Google Play AAB and test APK
        shell: pwsh
        run: |
          dotnet publish "${{ steps.locate.outputs.project }}" `
            -f net10.0-android36.0 `
            -c Release `
            -p:AndroidPackageFormats="aab;apk" `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="${{ steps.locate.outputs.keystore }}" `
            -p:AndroidSigningKeyAlias=qatfarm `
            -p:AndroidSigningKeyPass=QatFarmMobile2026Key `
            -p:AndroidSigningStorePass=QatFarmMobile2026Key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release" -Force | Out-Null

          $aab = Get-ChildItem -Path "${{ steps.locate.outputs.projectDir }}" -Recurse -Filter "*.aab" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $aab) { throw "No AAB was produced." }
          Copy-Item $aab.FullName "release/QatFarmMobile-GooglePlay.aab" -Force

          $apk = Get-ChildItem -Path "${{ steps.locate.outputs.projectDir }}" -Recurse -Filter "*-Signed.apk" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path "${{ steps.locate.outputs.projectDir }}" -Recurse -Filter "*.apk" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if ($apk) { Copy-Item $apk.FullName "release/QatFarmMobile-Test.apk" -Force }

          Get-FileHash "release/QatFarmMobile-GooglePlay.aab" -Algorithm SHA256 | Format-List | Out-File "release/SHA256.txt"
          if (Test-Path "release/QatFarmMobile-Test.apk") {
            Get-FileHash "release/QatFarmMobile-Test.apk" -Algorithm SHA256 | Format-List | Out-File "release/SHA256.txt" -Append
          }

      - name: Upload Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: QatFarmMobile-GooglePlay-1.1.0
          path: release/*
          if-no-files-found: error
          retention-days: 30
