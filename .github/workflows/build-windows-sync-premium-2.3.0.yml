name: QatFarm Windows Premium 2.3.0

on:
  push:
    branches:
      - final/windows-sync-premium-2.3.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        shell: pwsh
        run: |
          dotnet workload install maui-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate premium sync source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'src/QatFarm.Mobile/Services/AwadStorageService.cs',
            'src/QatFarm.Mobile/Services/DesktopSyncServer.cs',
            'src/QatFarm.Mobile/Platforms/Windows/MobilePdfService.Windows.cs',
            'src/QatFarm.Mobile/Platforms/Windows/App.xaml.cs',
            'installer/windows/QatFarmPremium.iss'
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing $file" } }
          $sync = Get-Content 'src/QatFarm.Mobile/Services/DesktopSyncServer.cs' -Raw
          foreach ($token in @('/api/local-sync/sync','X-AWAD-SYNC-KEY','UpdatedAtUtc','CreateAutomaticBackupAsync')) {
            if (-not $sync.Contains($token)) { throw "Missing sync token: $token" }
          }
          $storage = Get-Content 'src/QatFarm.Mobile/Services/AwadStorageService.cs' -Raw
          foreach ($token in @('عواد سوفت','النسخ الاحتياطية','فواتير البيع','التقارير','العملاء')) {
            if (-not $storage.Contains($token)) { throw "Missing storage token: $token" }
          }

      - name: Restore Windows target
        shell: pwsh
        run: |
          dotnet restore src/QatFarm.Mobile/QatFarm.Mobile.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows-publish | Out-Null
          dotnet publish src/QatFarm.Mobile/QatFarm.Mobile.csproj `
            -f net10.0-windows10.0.19041.0 `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:WindowsPackageType=None `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishReadyToRun=false `
            -o artifacts/windows-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'artifacts/windows-publish/QatFarm.Mobile.exe')) { throw 'QatFarm.Mobile.exe was not published.' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found.' }
          & $iscc installer/windows/QatFarmPremium.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = 'artifacts/installer/AWAD-SOFT-QatFarm-Windows-PREMIUM-2.3.0-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Installer was not generated.' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AWAD-SOFT-QatFarm-Windows-PREMIUM-2.3.0-Setup.exe" | Set-Content 'artifacts/installer/SHA256.txt' -Encoding ascii

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows-publish/* -DestinationPath artifacts/installer/AWAD-SOFT-QatFarm-Windows-PREMIUM-2.3.0-Portable.zip -CompressionLevel Optimal

      - name: Upload Windows Premium artifact
        uses: actions/upload-artifact@v4
        with:
          name: AWAD-SOFT-QatFarm-Windows-PREMIUM-2.3.0
          path: artifacts/installer/*
          if-no-files-found: error
          retention-days: 30
