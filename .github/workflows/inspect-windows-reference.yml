name: Inspect Windows Reference Source
on:
  push:
    branches: [final/voice-guided-2.2.1]
    paths: ['.github/workflows/inspect-windows-reference.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Windows source
        shell: pwsh
        run: |
          Expand-Archive '.github/QatFarmSystem_Windows_VIP_2.2.0.zip' -DestinationPath source -Force
          Write-Host '=== ROOT ==='
          Get-ChildItem source -Recurse -File | Where-Object { $_.Extension -in '.cs','.razor','.cshtml','.css','.js','.json','.csproj','.iss' } | ForEach-Object { $_.FullName.Replace((Resolve-Path source).Path + '\','') }
          Write-Host '=== INVOICE CANDIDATES ==='
          Get-ChildItem source -Recurse -File | Where-Object { $_.Name -match 'Invoice|Sale|Login|Farm|Layout|Nav|site.css|app.css' } | ForEach-Object { $_.FullName.Replace((Resolve-Path source).Path + '\','') }
      - name: Collect text source
        shell: pwsh
        run: |
          New-Item inspect -ItemType Directory -Force | Out-Null
          Get-ChildItem source -Recurse -File | Where-Object { $_.Extension -in '.cs','.razor','.cshtml','.css','.js','.csproj' } | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path source).Path.Length).TrimStart('\')
            $safe = $relative -replace '[\\/:*?"<>|]','__'
            Copy-Item $_.FullName (Join-Path inspect $safe) -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Source-Inspection
          path: inspect/*
          retention-days: 7
