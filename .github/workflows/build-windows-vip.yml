name: AWAD SOFT Windows FINAL 2.2.3

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vip-accounting-2.0
      - fix/windows-2.2.3-final
    paths:
      - '.github/QatFarmSystem_Windows_VIP_2.2.0.zip'
      - '.github/windows-vip-2.2.2/**'
      - '.github/windows-vip-2.2.3/**'
      - '.github/workflows/build-windows-vip.yml'

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract source and apply 2.2.3 final patch
        shell: pwsh
        run: |
          $archive = '.github/QatFarmSystem_Windows_VIP_2.2.0.zip'
          if (-not (Test-Path $archive)) { throw "Missing $archive" }
          Expand-Archive -Path $archive -DestinationPath windows-source -Force
          $builder = Get-ChildItem windows-source -Recurse -Filter Build-Installer.ps1 | Select-Object -First 1
          if (-not $builder) { throw 'Build-Installer.ps1 was not found.' }
          $windowsRoot = $builder.Directory.Parent.FullName

          $patchRoot = Join-Path (Get-Location) '.github\windows-vip-2.2.2'
          $patchFiles = @(
            'QatFarm.Web\Data\DatabaseSchemaUpdater.cs',
            'QatFarm.Web\database\Upgrade_Accounting_2_1.sql',
            'Testing\Product-Readiness-QA.ps1',
            'QatFarm.Web\QatFarm.Web.csproj',
            'Installer\QatFarmSystem.iss'
          )
          foreach ($relative in $patchFiles) {
            $source = Join-Path $patchRoot $relative
            $target = Join-Path $windowsRoot $relative
            if (-not (Test-Path $source)) { throw "Missing Windows patch file: $relative" }
            Copy-Item $source $target -Force
          }

          $finalPatch = Join-Path (Get-Location) '.github\windows-vip-2.2.3\Apply-FinalPatch.ps1'
          if (-not (Test-Path $finalPatch)) { throw 'Missing 2.2.3 final patch script.' }
          & $finalPatch -WindowsRoot $windowsRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regression gate for legacy database repair
        shell: pwsh
        run: |
          $builder = Get-ChildItem windows-source -Recurse -Filter Build-Installer.ps1 | Select-Object -First 1
          if (-not $builder) { throw 'Build-Installer.ps1 was not found after extraction.' }
          $windowsRoot = $builder.Directory.Parent.FullName
          $updaterPath = Join-Path $windowsRoot 'QatFarm.Web\Data\DatabaseSchemaUpdater.cs'
          $updater = Get-Content $updaterPath -Raw -Encoding UTF8
          $required = @(
            "COL_LENGTH(N'dbo.JournalEntries', N'Status')",
            "COL_LENGTH(N'dbo.JournalEntries', N'IsAutomatic')",
            "COL_LENGTH(N'dbo.JournalEntries', N'SourceHash')",
            "COL_LENGTH(N'dbo.JournalEntries', N'RowVersion')",
            'DuplicateKeys AS',
            "Version = N'2.2.3'"
          )
          foreach ($token in $required) {
            if (-not $updater.Contains($token)) { throw "Missing final migration token: $token" }
          }
          $repairIndex = $updater.IndexOf("COL_LENGTH(N'dbo.JournalEntries', N'IsAutomatic')")
          $sourceIndex = $updater.IndexOf('CREATE INDEX IX_JournalEntries_Source')
          if ($repairIndex -lt 0 -or $sourceIndex -le $repairIndex) {
            throw "IsAutomatic repair must run before IX_JournalEntries_Source. Repair=$repairIndex Index=$sourceIndex"
          }

          $project = Get-Content (Join-Path $windowsRoot 'QatFarm.Web\QatFarm.Web.csproj') -Raw -Encoding UTF8
          if (-not $project.Contains('<Version>2.2.3</Version>')) { throw 'Product version is not 2.2.3.' }

          $iss = Get-Content (Join-Path $windowsRoot 'Installer\QatFarmSystem.iss') -Raw -Encoding UTF8
          foreach ($token in @('QatFarmSystem_Setup_2.2.3_x64','pre-2.2.3.bak','remoteip=localsubnet','RunOnceId: "RemoveQatFarmSyncFirewall"')) {
            if (-not $iss.Contains($token)) { throw "Installer final hardening missing: $token" }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build and verify installer
        shell: pwsh
        run: |
          $builder = Get-ChildItem windows-source -Recurse -Filter Build-Installer.ps1 | Select-Object -First 1
          if (-not $builder) { throw 'Build-Installer.ps1 was not found.' }
          & $builder.FullName -SkipToolInstall -NoExplorer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke install and verify local web host
        shell: pwsh
        run: |
          $builder = Get-ChildItem windows-source -Recurse -Filter Build-Installer.ps1 | Select-Object -First 1
          if (-not $builder) { throw 'Build-Installer.ps1 was not found.' }
          $windowsRoot = $builder.Directory.Parent.FullName
          $setup = Get-ChildItem "$windowsRoot\Release\installer" -Filter '*2.2.3*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Windows 2.2.3 Setup.exe was not produced.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'AWAD-SOFT-QatFarm-2.2.3'
          $process = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOSQL',"/DIR=$installDir" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)." }
          $app = Join-Path $installDir 'QatFarm.Web.exe'
          if (-not (Test-Path $app)) { throw 'Installed application executable is missing.' }

          $env:DesktopMode__AutoOpenBrowser = 'false'
          $running = Start-Process $app -WorkingDirectory $installDir -PassThru
          try {
            $responded = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              if ($running.HasExited) { throw "Installed app exited early with $($running.ExitCode)." }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:5275/' -UseBasicParsing -TimeoutSec 2 -SkipHttpErrorCheck
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 600) {
                  $responded = $true
                  break
                }
              } catch { }
            }
            if (-not $responded) { throw 'Installed app did not expose the local web interface on port 5275.' }
          }
          finally {
            if (-not $running.HasExited) { Stop-Process -Id $running.Id -Force }
          }

      - name: Collect release package
        shell: pwsh
        run: |
          $builder = Get-ChildItem windows-source -Recurse -Filter Build-Installer.ps1 | Select-Object -First 1
          if (-not $builder) { throw 'Build-Installer.ps1 was not found.' }
          $windowsRoot = $builder.Directory.Parent.FullName
          New-Item release -ItemType Directory -Force | Out-Null
          $setup = Get-ChildItem "$windowsRoot\Release\installer" -Filter '*2.2.3*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Final 2.2.3 installer not found.' }
          Copy-Item $setup.FullName 'release/AWAD-SOFT-QatFarm-Windows-FINAL-2.2.3-Setup.exe' -Force
          Copy-Item "$windowsRoot\Release\RELEASE_INFO.txt" 'release/RELEASE_INFO.txt' -Force
          $hash = Get-FileHash 'release/AWAD-SOFT-QatFarm-Windows-FINAL-2.2.3-Setup.exe' -Algorithm SHA256
          "$($hash.Hash)  AWAD-SOFT-QatFarm-Windows-FINAL-2.2.3-Setup.exe" | Set-Content release/SHA256.txt -Encoding utf8

      - name: Upload ready Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AWAD-SOFT-QatFarm-Windows-FINAL-2.2.3-Setup
          path: release/*
          if-no-files-found: error
          retention-days: 30

# Triggered from ChatGPT to produce the current Windows installer artifact.
