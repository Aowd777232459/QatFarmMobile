name: QatFarm VIP 2.0.1 Credit Limit SMS APK

on:
  push:
    branches:
      - feature/credit-sms-2.0.1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract VIP 2.0 source
        shell: pwsh
        run: |
          $baseZip = "QatFarmMobile_Source_1.2.1_FIXED.zip"
          $vipPatch = "QatFarmMobile_VIP_Patch_2.0.0.zip"
          if (-not (Test-Path $baseZip)) { throw "$baseZip was not found." }
          if (-not (Test-Path $vipPatch)) { throw "$vipPatch was not found." }
          if (Test-Path source) { Remove-Item source -Recurse -Force }
          Expand-Archive -Path $baseZip -DestinationPath source -Force
          Expand-Archive -Path $vipPatch -DestinationPath source -Force

      - name: Apply credit limit and SMS update
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".github/credit-sms-patch/part*.patch" | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 credit SMS patch parts." }
          $patch = Join-Path $env:RUNNER_TEMP "credit-sms-2.0.1.patch"
          $builder = New-Object System.Text.StringBuilder
          foreach ($part in $parts) {
            [void]$builder.Append([IO.File]::ReadAllText($part.FullName, [Text.Encoding]::UTF8))
          }
          [IO.File]::WriteAllText($patch, $builder.ToString(), [Text.UTF8Encoding]::new($false))
          Push-Location source
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          $project = Get-ChildItem source -Recurse -Filter QatFarm.Mobile.csproj | Select-Object -First 1
          if (-not $project) { throw "QatFarm.Mobile.csproj was not found." }
          $keystore = Get-ChildItem source -Recurse -Filter QatFarmMobile.keystore | Select-Object -First 1
          if (-not $keystore) { throw "Stable QatFarmMobile.keystore was not found." }
          "PROJECT=$($project.FullName)" | Out-File $env:GITHUB_ENV -Append
          "PROJECT_DIR=$($project.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append
          "KEYSTORE=$($keystore.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Verify 2.0.1 credit SMS source
        shell: pwsh
        run: |
          $root = Split-Path $env:PROJECT -Parent
          $projectText = Get-Content $env:PROJECT -Raw
          if (-not $projectText.Contains('<ApplicationDisplayVersion>2.0.1</ApplicationDisplayVersion>')) { throw "Wrong app version." }
          if (-not $projectText.Contains('<ApplicationVersion>21</ApplicationVersion>')) { throw "Wrong version code." }
          if (-not $projectText.Contains('<AndroidPackageFormats>apk</AndroidPackageFormats>')) { throw "APK-only configuration missing." }

          $manifest = Get-Content (Join-Path $root 'Platforms/Android/AndroidManifest.xml') -Raw
          if (-not $manifest.Contains('android.permission.SEND_SMS')) { throw "SEND_SMS permission missing." }

          $domain = Get-Content (Join-Path $root 'Models/DomainModels.cs') -Raw
          $service = Get-Content (Join-Path $root 'Services/QatFarmService.cs') -Raw
          $sms = Get-Content (Join-Path $root 'Services/DebtSmsService.cs') -Raw
          $customers = Get-Content (Join-Path $root 'Components/Pages/Customers.razor') -Raw
          foreach ($needle in @('SellerPhone','CreditLimit','DebtAlertEnabled','LastDebtAlertBalance')) {
            if (-not $domain.Contains($needle)) { throw "Missing customer field: $needle" }
          }
          foreach ($needle in @('CalculateCustomerBalanceAsync','تم رفض البيع الآجل','SendCreditAlertIfNeededAsync')) {
            if (-not $service.Contains($needle)) { throw "Missing credit rule: $needle" }
          }
          if (-not $sms.Contains('SendSmsPermission') -or -not $sms.Contains('SendTextMessage')) { throw "Direct SMS implementation missing." }
          if (-not $customers.Contains('رقم البائع المرتبط') -or -not $customers.Contains('100,000')) { throw "Customer credit UI missing." }

      - name: Install .NET MAUI Android workload
        shell: pwsh
        run: |
          dotnet workload install maui-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Android API 36 SDK
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkmanager)) {
            $candidate = Get-ChildItem (Join-Path $env:ANDROID_HOME "cmdline-tools") -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $sdkmanager = $candidate.FullName }
          }
          if (-not (Test-Path $sdkmanager)) { throw "sdkmanager.bat was not found." }
          & $sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore and compile
        shell: pwsh
        run: |
          dotnet workload restore $env:PROJECT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $env:PROJECT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $env:PROJECT -f net10.0-android36.0 -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build stable signed installable APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          dotnet publish $env:PROJECT -f net10.0-android36.0 -c Release --no-restore `
            -p:AndroidPackageFormats=apk `
            -p:AndroidCreatePackagePerAbi=false `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:KEYSTORE" `
            -p:AndroidSigningKeyAlias=qatfarm `
            -p:AndroidSigningKeyPass=QatFarmMobile2026Key `
            -p:AndroidSigningStorePass=QatFarmMobile2026Key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $apk = Get-ChildItem $env:PROJECT_DIR -Recurse -Filter '*-Signed.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem $env:PROJECT_DIR -Recurse -Filter '*.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 }
          if (-not $apk) { throw "No APK was produced." }
          Copy-Item $apk.FullName 'release/QatFarmMobile-VIP-2.0.1-Credit-SMS.apk' -Force
          Get-FileHash 'release/QatFarmMobile-VIP-2.0.1-Credit-SMS.apk' -Algorithm SHA256 | Format-List | Out-File 'release/SHA256.txt'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QatFarmMobile-VIP-2.0.1-Credit-SMS
          path: release/*
          if-no-files-found: error
          retention-days: 30

  smoke-test-android:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: QatFarmMobile-VIP-2.0.1-Credit-SMS
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and verify startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apk/QatFarmMobile-VIP-2.0.1-Credit-SMS.apk
            adb logcat -c
            adb shell monkey -p com.qatfarm.mobile -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.qatfarm.mobile | tee app-pid.txt
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > app-startup.png
            test -s app-pid.txt
            grep -q 'QATFARM_STARTUP_OK' logcat.txt
            ! grep -q 'QATFARM_STARTUP_ERROR' logcat.txt

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QatFarmMobile-2.0.1-startup-diagnostics
          path: |
            app-startup.png
            app-pid.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 14
