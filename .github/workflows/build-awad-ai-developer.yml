name: AWAD AI Developer Windows 1.0

on:
  workflow_dispatch:
  push:
    branches:
      - standalone/awad-ai-developer-v1
    paths:
      - 'standalone/AWAD.AIDeveloper/**'
      - '.github/workflows/build-awad-ai-developer.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore standalone/AWAD.AIDeveloper/AWAD.AIDeveloper.csproj
      - name: Publish single-file Windows x64
        shell: pwsh
        run: |
          New-Item release -ItemType Directory -Force | Out-Null
          dotnet publish standalone/AWAD.AIDeveloper/AWAD.AIDeveloper.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o release/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem release/app -Filter 'AWAD-AI-Developer.exe' | Select-Object -First 1
          if (-not $exe) { throw 'AWAD-AI-Developer.exe not found.' }
          Copy-Item $exe.FullName 'release/AWAD-AI-Developer-1.0.0-Windows-x64.exe' -Force
          Copy-Item 'standalone/AWAD.AIDeveloper/README_AR.md' 'release/README_AR.md' -Force
          (Get-FileHash 'release/AWAD-AI-Developer-1.0.0-Windows-x64.exe' -Algorithm SHA256).Hash | Set-Content 'release/SHA256.txt'
          Compress-Archive -Path 'release/AWAD-AI-Developer-1.0.0-Windows-x64.exe','release/README_AR.md','release/SHA256.txt' -DestinationPath 'release/AWAD-AI-Developer-1.0.0-Windows-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AWAD-AI-Developer-1.0.0-Windows-x64
          path: |
            release/AWAD-AI-Developer-1.0.0-Windows-x64.exe
            release/AWAD-AI-Developer-1.0.0-Windows-x64.zip
            release/README_AR.md
            release/SHA256.txt
          retention-days: 30
