name: QatFarm VIP Credit SMS Final APK

on:
  push:
    branches:
      - feature/credit-sms-2.0.1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download exact exported VIP 2.0 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe -L --fail-with-body `
            -H "Authorization: Bearer $env:GH_TOKEN" `
            -H "Accept: application/vnd.github+json" `
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9737260061/zip" `
            -o merged-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive merged-source.zip source -Force

      - name: Apply credit limit and SMS patch to exact source
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.github/credit-sms-patch/part*.patch' | Sort-Object Name
          if ($parts.Count -ne 5) { throw 'Expected 5 patch parts.' }
          $patch = Join-Path $env:RUNNER_TEMP 'credit-sms.patch'
          $text = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::UTF8) }) -join ''
          [IO.File]::WriteAllText($patch, $text, [Text.UTF8Encoding]::new($false))
          Push-Location source
          git init
          git config core.autocrlf false
          git config core.safecrlf false
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          $project = Get-ChildItem source -Recurse -Filter QatFarm.Mobile.csproj | Select-Object -First 1
          $key = Get-ChildItem source -Recurse -Filter QatFarmMobile.keystore | Select-Object -First 1
          if (-not $project -or -not $key) { throw 'Project or stable signing key missing.' }
          "PROJECT=$($project.FullName)" | Out-File $env:GITHUB_ENV -Append
          "PROJECT_DIR=$($project.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append
          "KEYSTORE=$($key.FullName)" | Out-File $env:GITHUB_ENV -Append
          $root = $project.Directory.FullName
          foreach ($required in @('Services/DebtSmsService.cs','Services/QatFarmService.cs','Components/Pages/Customers.razor','Platforms/Android/AndroidManifest.xml')) {
            if (-not (Test-Path (Join-Path $root $required))) { throw "Missing $required" }
          }
          $manifest = Get-Content (Join-Path $root 'Platforms/Android/AndroidManifest.xml') -Raw
          if (-not $manifest.Contains('android.permission.SEND_SMS')) { throw 'SEND_SMS permission missing.' }

      - name: Install Android workload
        shell: pwsh
        run: |
          dotnet workload install maui-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Android API 36
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) {
            $sdkmanager = (Get-ChildItem (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $sdkmanager) { throw 'sdkmanager not found.' }
          & $sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore and compile
        shell: pwsh
        run: |
          dotnet workload restore $env:PROJECT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $env:PROJECT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $env:PROJECT -f net10.0-android36.0 -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build stable signed APK only
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          dotnet publish $env:PROJECT -f net10.0-android36.0 -c Release --no-restore `
            -p:ApplicationDisplayVersion=2.0.1 `
            -p:ApplicationVersion=21 `
            -p:AndroidPackageFormats=apk `
            -p:AndroidCreatePackagePerAbi=false `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:KEYSTORE" `
            -p:AndroidSigningKeyAlias=qatfarm `
            -p:AndroidSigningKeyPass=QatFarmMobile2026Key `
            -p:AndroidSigningStorePass=QatFarmMobile2026Key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $apk = Get-ChildItem $env:PROJECT_DIR -Recurse -Filter '*-Signed.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem $env:PROJECT_DIR -Recurse -Filter '*.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 }
          if (-not $apk) { throw 'No APK produced.' }
          Copy-Item $apk.FullName release/QatFarmMobile-VIP-2.0.1-Credit-SMS.apk -Force
          Get-FileHash release/QatFarmMobile-VIP-2.0.1-Credit-SMS.apk -Algorithm SHA256 | Format-List | Out-File release/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: QatFarmMobile-VIP-2.0.1-Credit-SMS-FINAL
          path: release/*
          retention-days: 30

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QatFarmMobile-VIP-2.0.1-Credit-SMS-FINAL
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apk/QatFarmMobile-VIP-2.0.1-Credit-SMS.apk
            adb logcat -c
            adb shell monkey -p com.qatfarm.mobile -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.qatfarm.mobile | tee app-pid.txt
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > app-startup.png
            test -s app-pid.txt
            grep -q 'QATFARM_STARTUP_OK' logcat.txt
            ! grep -q 'QATFARM_STARTUP_ERROR' logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QatFarmMobile-2.0.1-startup-diagnostics-final
          path: |
            app-startup.png
            app-pid.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 14
