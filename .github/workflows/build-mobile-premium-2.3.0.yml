name: QatFarm Mobile Premium 2.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - final/windows-sync-premium-2.3.0
    paths:
      - 'src/QatFarm.Mobile/**'
      - '.github/workflows/build-mobile-premium-2.3.0.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android
      - name: Ensure Android API 36
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) { $sdkmanager = (Get-ChildItem (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Recurse -Filter sdkmanager.bat | Select-Object -First 1).FullName }
          & $sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Validate system builder source
        shell: pwsh
        run: |
          foreach ($file in @('src/QatFarm.Mobile/Components/Pages/SystemBuilder.razor','src/QatFarm.Mobile/Components/Pages/CustomDocuments.razor','src/QatFarm.Mobile/Services/CustomDocumentService.cs','src/QatFarm.Mobile/Models/CustomDocumentModels.cs')) { if (-not (Test-Path $file)) { throw "Missing $file" } }
      - name: Generate release signing key
        shell: pwsh
        run: |
          keytool -genkeypair -v -keystore qatfarm-premium.jks -storepass QatFarmPremium230 -keypass QatFarmPremium230 -alias qatfarm -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AWAD SOFT,OU=QatFarm,O=AWAD SOFT,L=Sanaa,C=YE"
      - name: Restore build and publish APK
        shell: pwsh
        run: |
          $project = (Resolve-Path 'src/QatFarm.Mobile/QatFarm.Mobile.csproj').Path
          dotnet restore $project -p:TargetFramework=net10.0-android36.0
          dotnet build $project -f net10.0-android36.0 -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish $project -f net10.0-android36.0 -c Release --no-restore -p:ApplicationDisplayVersion=2.3.0 -p:ApplicationVersion=42 -p:AndroidPackageFormats=apk -p:AndroidCreatePackagePerAbi=false -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$PWD/qatfarm-premium.jks" -p:AndroidSigningKeyAlias=qatfarm -p:AndroidSigningKeyPass=QatFarmPremium230 -p:AndroidSigningStorePass=QatFarmPremium230
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item release -ItemType Directory -Force | Out-Null
          $apk = Get-ChildItem 'src/QatFarm.Mobile' -Recurse -Filter '*-Signed.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem 'src/QatFarm.Mobile' -Recurse -Filter '*.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 }
          if (-not $apk) { throw 'APK not found.' }
          Copy-Item $apk.FullName 'release/QatFarmMobile-AWAD-SOFT-2.3.0-PREMIUM.apk' -Force
          (Get-FileHash 'release/QatFarmMobile-AWAD-SOFT-2.3.0-PREMIUM.apk' -Algorithm SHA256).Hash | Set-Content release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: QatFarmMobile-AWAD-SOFT-2.3.0-PREMIUM
          path: release/*
          retention-days: 30
