name: QatFarm Final 2.1.0 APK

on:
  push:
    branches:
      - final/2.1.0
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4

      - name: Download tested 2.0.1 prepared source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9738604683/zip" \
            -o source-artifact.zip
          mkdir source
          unzip -q source-artifact.zip -d source

      - name: Apply final 2.1.0 patch and verify features
        run: |
          cat .github/final-2.1.0-patch/part*.patch > /tmp/final-2.1.0.patch
          echo "Patch SHA256: $(sha256sum /tmp/final-2.1.0.patch)"
          cd source/QatFarmMobile_Android/QatFarm.Mobile
          git init -q
          git config core.autocrlf false
          git apply --check /tmp/final-2.1.0.patch
          git apply /tmp/final-2.1.0.patch

          grep -q '<ApplicationDisplayVersion>2.1.0</ApplicationDisplayVersion>' QatFarm.Mobile.csproj
          grep -q '<ApplicationVersion>30</ApplicationVersion>' QatFarm.Mobile.csproj
          grep -q '<AndroidPackageFormats>apk</AndroidPackageFormats>' QatFarm.Mobile.csproj
          grep -q 'android.permission.SEND_SMS' Platforms/Android/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' Platforms/Android/AndroidManifest.xml
          grep -q 'AccessCodeHash' Models/DomainModels.cs
          grep -q 'CanEditInvoices' Models/DomainModels.cs
          grep -q 'CanDeleteInvoices' Models/DomainModels.cs
          grep -q 'CreateMonthlyInvoicesPdfAsync' Services/MobilePdfService.cs
          grep -q 'DeleteInvoiceAsync' Services/QatFarmService.cs
          grep -q 'SendSaleReceiptAsync' Services/DebtSmsService.cs
          grep -q 'إجمالي الحساب' Services/DebtSmsService.cs
          grep -q 'ZakatNotificationService' Services/ZakatNotificationService.cs
          grep -q 'ZakatRecipientName' Models/DomainModels.cs
          grep -q 'data-background' wwwroot/js/ui-preferences.js
          ! grep -R -n -E 'VIP 2\.0|VIP Accounting|لوحة التحكم VIP|المركز المالي VIP' Components || exit 1

      - name: Upload prepared 2.1.0 source
        uses: actions/upload-artifact@v4
        with:
          name: QatFarmMobile-Final-2.1.0-Prepared-Source
          path: source/
          retention-days: 14

  build-android:
    needs: prepare-source
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: QatFarmMobile-Final-2.1.0-Prepared-Source
          path: source

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Locate project and stable signing key
        shell: pwsh
        run: |
          $project = Get-ChildItem source -Recurse -Filter QatFarm.Mobile.csproj | Select-Object -First 1
          $key = Get-ChildItem source -Recurse -Filter QatFarmMobile.keystore | Select-Object -First 1
          if (-not $project -or -not $key) { throw 'Project or stable signing key missing.' }
          "PROJECT=$($project.FullName)" | Out-File $env:GITHUB_ENV -Append
          "PROJECT_DIR=$($project.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append
          "KEYSTORE=$($key.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Install .NET MAUI Android workload
        shell: pwsh
        run: |
          dotnet workload install maui-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Android API 36 SDK
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) {
            $candidate = Get-ChildItem (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $sdkmanager = $candidate.FullName }
          }
          if (-not (Test-Path $sdkmanager)) { throw 'sdkmanager.bat was not found.' }
          & $sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore and compile Release
        shell: pwsh
        run: |
          dotnet workload restore $env:PROJECT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore $env:PROJECT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $env:PROJECT -f net10.0-android36.0 -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build stable signed final APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          dotnet publish $env:PROJECT -f net10.0-android36.0 -c Release --no-restore `
            -p:ApplicationDisplayVersion=2.1.0 `
            -p:ApplicationVersion=30 `
            -p:AndroidPackageFormats=apk `
            -p:AndroidCreatePackagePerAbi=false `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:KEYSTORE" `
            -p:AndroidSigningKeyAlias=qatfarm `
            -p:AndroidSigningKeyPass=QatFarmMobile2026Key `
            -p:AndroidSigningStorePass=QatFarmMobile2026Key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $apk = Get-ChildItem $env:PROJECT_DIR -Recurse -Filter '*-Signed.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem $env:PROJECT_DIR -Recurse -Filter '*.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 }
          if (-not $apk) { throw 'No APK was produced.' }
          Copy-Item $apk.FullName 'release/QatFarmMobile-Final-2.1.0.apk' -Force
          Get-FileHash 'release/QatFarmMobile-Final-2.1.0.apk' -Algorithm SHA256 | Format-List | Out-File 'release/SHA256.txt'

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: QatFarmMobile-Final-2.1.0
          path: release/*
          if-no-files-found: error
          retention-days: 30

  smoke-test-android:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download final APK
        uses: actions/download-artifact@v4
        with:
          name: QatFarmMobile-Final-2.1.0
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and verify startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apk/QatFarmMobile-Final-2.1.0.apk
            adb logcat -c
            adb shell monkey -p com.qatfarm.mobile -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.qatfarm.mobile | tee app-pid.txt
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > app-startup.png
            test -s app-pid.txt
            grep -q 'QATFARM_STARTUP_OK' logcat.txt
            ! grep -q 'QATFARM_STARTUP_ERROR' logcat.txt

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QatFarmMobile-Final-2.1.0-startup-diagnostics
          path: |
            app-startup.png
            app-pid.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 14
