name: AWAD SOFT ERP 3.0.0

on:
  workflow_dispatch:
  push:
    branches:
      - final/erp-reference-3.0.0
    paths:
      - 'src/QatFarm.Mobile/**'
      - 'tests/AccountingChecks/**'
      - '.github/workflows/build-erp-3.0.0.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Accounting and Arabic parser checks
        run: |
          dotnet run --project tests/AccountingChecks/AccountingChecks.csproj -c Release | tee checks.txt
          grep -q 'ACCOUNTING_CHECKS_OK' checks.txt
          grep -q 'VOICE_PARSER_CHECKS_OK' checks.txt
      - name: ERP 3.0 feature gates
        run: |
          grep -q '<ApplicationDisplayVersion>3.0.0</ApplicationDisplayVersion>' src/QatFarm.Mobile/QatFarm.Mobile.csproj
          grep -q 'net10.0-windows10.0.19041.0' src/QatFarm.Mobile/QatFarm.Mobile.csproj
          grep -q 'paymentChoiceConfirmed' src/QatFarm.Mobile/Components/Pages/InvoiceEdit.razor
          grep -q 'اختر أنت طريقة الدفع' src/QatFarm.Mobile/Components/Pages/InvoiceEdit.razor
          grep -q 'voiceCustomerId' src/QatFarm.Mobile/Components/Pages/InvoiceEdit.razor
          grep -q 'erp3-sidebar' src/QatFarm.Mobile/Components/Layout/MainLayout.razor
          grep -q 'erp3-payment-choice' src/QatFarm.Mobile/wwwroot/css/erp3.css
          grep -q 'الاسم الرباعي لمدير النظام' src/QatFarm.Mobile/Components/Login.razor
          ! grep -q '<label>الموقع</label>' src/QatFarm.Mobile/Components/Pages/Farms.razor

  android:
    needs: verify-core
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android
      - name: Ensure Android API 36
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) {
            $candidate = Get-ChildItem (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $sdkmanager = $candidate.FullName }
          }
          if (-not (Test-Path $sdkmanager)) { throw 'sdkmanager.bat was not found.' }
          & $sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download stable signing material
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          curl.exe -L --fail-with-body `
            -H "Authorization: Bearer $env:GH_TOKEN" `
            -H "Accept: application/vnd.github+json" `
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9738604683/zip" `
            -o stable-source.zip
          Expand-Archive stable-source.zip -DestinationPath stable-source -Force
          $key = Get-ChildItem stable-source -Recurse -Filter QatFarmMobile.keystore | Select-Object -First 1
          if (-not $key) { throw 'Stable signing key was not found.' }
          "KEYSTORE=$($key.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Build signed APK
        shell: pwsh
        env:
          QATFARM_SIGN_PASS: ${{ secrets.QATFARM_SIGN_PASS }}
        run: |
          $project=(Resolve-Path 'src/QatFarm.Mobile/QatFarm.Mobile.csproj').Path
          $signPass = if ([string]::IsNullOrWhiteSpace($env:QATFARM_SIGN_PASS)) { 'QatFarmMobile2026Key' } else { $env:QATFARM_SIGN_PASS }
          dotnet restore $project -p:TargetFramework=net10.0-android36.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project -f net10.0-android36.0 -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish $project -f net10.0-android36.0 -c Release --no-restore `
            -p:ApplicationDisplayVersion=3.0.0 `
            -p:ApplicationVersion=50 `
            -p:AndroidPackageFormats=apk `
            -p:AndroidCreatePackagePerAbi=false `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:KEYSTORE" `
            -p:AndroidSigningKeyAlias=qatfarm `
            -p:AndroidSigningKeyPass="$signPass" `
            -p:AndroidSigningStorePass="$signPass"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item release-android -ItemType Directory -Force | Out-Null
          $apk = Get-ChildItem 'src/QatFarm.Mobile' -Recurse -Filter '*-Signed.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem 'src/QatFarm.Mobile' -Recurse -Filter '*.apk' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 }
          if (-not $apk) { throw 'No APK was produced.' }
          Copy-Item $apk.FullName 'release-android/AWAD-SOFT-QatFarm-ERP-3.0.0.apk' -Force
          (Get-FileHash 'release-android/AWAD-SOFT-QatFarm-ERP-3.0.0.apk' -Algorithm SHA256).Hash | Set-Content 'release-android/SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: AWAD-SOFT-QatFarm-ERP-3.0.0-Android
          path: release-android/*
          retention-days: 30

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AWAD-SOFT-QatFarm-ERP-3.0.0-Android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apk/AWAD-SOFT-QatFarm-ERP-3.0.0.apk
            adb logcat -c
            adb shell monkey -p com.qatfarm.mobile -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.qatfarm.mobile | tee app-pid.txt
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > app-startup.png
            test -s app-pid.txt
            grep -q 'QATFARM_STARTUP_OK' logcat.txt
            ! grep -q 'QATFARM_STARTUP_ERROR' logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AWAD-SOFT-QatFarm-ERP-3.0.0-Android-diagnostics
          path: |
            app-startup.png
            app-pid.txt
            logcat.txt
          if-no-files-found: warn
          retention-days: 14

  windows:
    needs: verify-core
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows
      - name: Build and publish Windows x64
        shell: pwsh
        run: |
          $project=(Resolve-Path 'src/QatFarm.Mobile/QatFarm.Mobile.csproj').Path
          dotnet restore $project -p:TargetFramework=net10.0-windows10.0.19041.0 -r win-x64 -p:PublishReadyToRun=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project -f net10.0-windows10.0.19041.0 -c Release -r win-x64 --no-restore -p:WindowsPackageType=None -p:PublishReadyToRun=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish $project -f net10.0-windows10.0.19041.0 -c Release -r win-x64 --self-contained true --no-restore `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -o win-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'win-publish/QatFarm.Mobile.exe')) { throw 'Windows executable was not produced.' }
      - name: Smoke start Windows app
        shell: pwsh
        run: |
          $app=(Resolve-Path 'win-publish/QatFarm.Mobile.exe').Path
          $p=Start-Process $app -WorkingDirectory (Resolve-Path 'win-publish').Path -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Windows app exited early with code $($p.ExitCode)." }
          Stop-Process -Id $p.Id -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Create installer
        shell: pwsh
        run: |
          New-Item release-windows -ItemType Directory -Force | Out-Null
          @'
          #define MyAppName "نظام زراعي عواد سوفت"
          #define MyAppVersion "3.0.0"
          #define MyAppPublisher "AWAD SOFT"
          #define MyAppExeName "QatFarm.Mobile.exe"
          [Setup]
          AppId={{B770435C-1CCF-4CF4-A12D-3F08A461D5A8}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\AWAD SOFT\QatFarm ERP
          DefaultGroupName={#MyAppName}
          OutputDir=release-windows
          OutputBaseFilename=AWAD-SOFT-QatFarm-ERP-3.0.0-Windows-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          PrivilegesRequired=admin
          [Files]
          Source: "win-publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "تشغيل {#MyAppName}"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer.iss -Encoding utf8
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*' -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { $iscc = Get-ChildItem "$env:LOCALAPPDATA\Programs\Inno Setup*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $iscc) { throw 'ISCC.exe was not found.' }
          & $iscc.FullName installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup=Get-ChildItem release-windows -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer was not produced.' }
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash | Set-Content 'release-windows/SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: AWAD-SOFT-QatFarm-ERP-3.0.0-Windows
          path: release-windows/*
          retention-days: 30
